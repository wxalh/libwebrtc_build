            "${{ needs.linux.result }}" \
            "${{ needs.android.result }}" \
            "${{ needs.apple.result }}"; do
            if [[ "$result" != "success" ]]; then
              echo "Required build job result is not success: $result" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - name: Plan split release packages
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 script/common/release_packages.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package-release:
    needs: plan-release-packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-release-packages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Download package build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a artifacts <<< "${{ matrix.artifacts }}"
          bash script/common/download_run_artifacts.sh \
            "$GITHUB_RUN_ID" \
            "$GITHUB_REPOSITORY" \
            platform-artifacts \
            "${artifacts[@]}"

      - name: Stage self-contained release packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staged dist
          mkdir -p staged dist
          python3 script/common/release_packages.py stage \
            --group "${{ matrix.group }}" \
            --artifacts-root platform-artifacts \
            --output-root staged

      - name: Archive self-contained release packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_dirs=(staged/libwebrtc-*)
          if [[ "${#package_dirs[@]}" -eq 0 ]]; then
            echo "No staged release package directories found." >&2
            exit 1
          fi
          for dir in "${package_dirs[@]}"; do
            asset="$(basename "$dir").tar.zst"
            tar -I 'zstd -T0 -10' -cf "dist/$asset" -C "$dir" .
          done
          if find dist -maxdepth 1 -type f -name '*full*' | grep -q .; then
            echo "Full all-platform archives are forbidden." >&2
            exit 1
          fi

      - name: Upload split package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.group }}
          path: dist
          if-no-files-found: error

  release:
    needs: package-release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download split package artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(python3 script/common/release_packages.py release-artifacts)
          bash script/common/download_run_artifacts.sh --merge \
            "$GITHUB_RUN_ID" \
            "$GITHUB_REPOSITORY" \
            dist \
            "${artifacts[@]}"

      - name: Generate split package manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            release_tag="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="build-$(date +%Y%m%d)"
          fi
          python3 script/common/generate_release_manifest.py \
            --assets dist \
            --release-tag "$release_tag" \
            --output dist/libwebrtc-manifest.json
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Upload split package index
        uses: actions/upload-artifact@v7
        with:
          name: libwebrtc-release-index
          path: dist/libwebrtc-manifest.json
          if-no-files-found: error

      - name: Publish split packages to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.manifest.outputs.release_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag --yes
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "LibWebRTC $tag" \
            --notes "Self-contained per-ABI LibWebRTC packages built by GitHub Actions." \
            --latest
          while IFS= read -r release_asset; do
            gh release upload "$tag" "$release_asset" --clobber
          done < <(find dist -maxdepth 1 -type f -print | LC_ALL=C sort)

  verify:
    if: inputs.target == 'verify'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-in scripts
        shell: pwsh
        run: |
          Get-ChildItem script -Recurse -Filter *.ps1 | ForEach-Object {
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $_.FullName), [ref]$null)
          }
